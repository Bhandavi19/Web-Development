<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
    <style>
        nav ul li.home {
            list-style: inside;
            list-style-type: devanagari;
            /* border: 3px solid black;
            background-color: aqua; */
            color: rgb(232, 39, 39);
            padding: 10px;
            /* display: inline-block; */
            list-style-type: "🏡";
            text-align: right;

        }

        nav ul li.about {
            list-style: inside;
            list-style-type: devanagari;
            /* border: 3px solid black;
            background-color: aqua; */
            color: rgb(232, 39, 39);
            padding: 10px;
            /* display: inline-block; */
            list-style-type: "💃";
            text-align: right;
        }

        .contact {
            list-style: inside;
            list-style-type: devanagari;
            /* border: 3px solid black;
            background-color: aqua; */
            color: rgb(232, 39, 39);
            padding: 10px;
            /* display: inline-block; */
            list-style-type: "📞";
            list-style-position: inside;
            text-align: right;
        }

        nav ol li {
            border: 2px solid black;
            /* list-style: inside; */
            list-style-type: lower-roman;
            list-style-position: inside;
            display: inline-flexbox;

        }
    </style>
</head>

<body>
    <nav>
        <ul>
            <li class="home">Home</li>
            <li class="about">About</li>
            <li class="contact">Contact</li>
        </ul>
        <ol>
            <li>apple</li>
            <li>banana</li>
            <li>mango</li>
        </ol>
    </nav>
</body>

</html>
