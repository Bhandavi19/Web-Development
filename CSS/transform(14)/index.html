<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform</title>
    <style>
        .container {
            width: 100%;
            height: 60vh;
            border: 3px solid black;
        }

        .box {
            width: 60px;
            height: 60px;
            border: 3px solid green;
            background-color: aqua;
            /* transform:rotateZ(50deg); */
            /* transform: rotate(0.25turn); */
            /* transform: scaleX(1.4); */
            /* transform: skewY(30deg); */
            transform: translateY(40px) skew(30deg) translateX(100px) scale(1.6) rotate(0.25turn);
            transform-origin: top;
            /* transform: matrix3d(100px); */
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">box</div>
    </div>
</body>

</html>


<!-- 1 turn = 360deg
 0.25 = 90deg
 0.5 = 180deg
 0.75 = 270deg -->



<!-- scale(1.5) = it increases by 1.5 times from its original size
  we have scaleX(),scaleY(), scale3d(),scaleZ()-->



<!-- skew can't be applied on Z direction -->



<!-- we can use one or more tranform property at a time
   
  tranform: translateX(100)-->


<!-- transform-origin: top  the box changes it's otigin so that it can move according to that origin -->
