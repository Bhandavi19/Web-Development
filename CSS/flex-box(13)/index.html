<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-Box</title>
    <style>
        .container {
            color: crimson;
            border: 2px solid maroon;
            display: flex;
            /* justify-content is for horizontal alginment */
            justify-content: center;
            /* algin item is for single line */
            align-items: center;
            /* flex-direction: column; */
            flex-direction: row;
            flex-wrap: wrap;
            /* algin content is for mutiple lines for vertical alginment */
            /* align-content: center; */
            height: 40vh;
            /* flex flow is a property where it is a shorthand property for flex diretcion and flex-wrap */
            flex-flow: row wrap;
            gap: 30px 10px;

        }

        .item {
            color: rgb(228, 140, 24);
            background-color: aqua;
            border: 2px solid black;
            /* margin: 3px; */
            /* padding: 4px; */
            width: 30px;
            height: 20px;
        }

        .order-1 {
            order: 1;
        }

        .order-2 {
            order: 2;
        }

        .order-3 {
            order: 3;
        }

        .order-4 {
            order: 4;
        }

        .item1 {
            /* flex-grow: 3; */
            /* the particular item will be shrinked when ever it is neccesary */
            /* flex-shrink: 2; */
            align-self: self-end;
        }
    </style>
</head>
