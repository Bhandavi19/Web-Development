<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <style>
        .container {
            height: 50vh;
            width: 50vw;
            background-color: aquamarine;
        }

        .box {
            border: 10px solid;
            height: 60px;
            width: 70px;
            background-color: beige;
            /* transition-property: all;
            transition-duration: 3s;
            transition-timing-function: cubic-bezier(1, 0.67, 0.14, 0.59);
            transition-delay: 0.5s; */

            transition: all 2s cubic-bezier(1, 0.67, 0.14, 0.59) 1s;
        }

        .container:hover .box {
            transform: translateX(30px) translateY(30px) scale(1.5) skew(30deg);
            background-color: blue;
            border: 4px solid black;
        }

        .second {
            width: 120px;
            background-color: rgb(184, 177, 177);

            height: 150px;
        }

        .box1 {
            width: 120px;
            height: 150px;
            transition: all 0.5s ease-out 0.5s;
        }

        .second:hover .box1 {
            transform: scale(1.25);
            background-color: rgb(228, 225, 225);

        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box translate">

        </div>
    </div>

    <div class="second">
        <div class="box1">
            scaleX
        </div>
    </div>

</body>

</html>
