<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filters</title>
    <style>
        img {
            filter: blur(2px);
            filter: brightness(2);
            filter: contrast(200);
            filter: drop-shadow(15px 14px 13px);
            /* filter: grayscale(50%); */
            /* filter: sepia(20); */
            /* filter: opacity(30%); */
            /* filter: invert(65%); */
            /* filter: hue-rotate(45deg); */
            /* filter: saturate(10); */

        }
    </style>
</head>

<body>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSDaPTpzmpcMVexxG1ZtNNgNaQJTSTOER1tEg&s">

    <p><b>bold</b></p>
    <small>small</small>
    <strong>strong</strong>
    <hr>line</hr>
    <p>i am a <mark>student</mark></p>
    <p>i am not a <del>teacher</del></p>
    <p>i am a <sub>student</sub></p>
    <p>i am a <sup>student</sup></p>
    <u>i am underlined</u>
    <video src=""></video>
    <audio src=""></audio>
    
    <figure>
        <figcaption>I am figure</figcaption>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSDaPTpzmpcMVexxG1ZtNNgNaQJTSTOER1tEg&s" alt="">
        
    </figure>
</body>

</html>
