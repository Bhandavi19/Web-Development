<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position</title>
    <style>
        .box {
            margin: 5px;
            padding: 5px;
            border: 3px solid black;
            width: 80vw;
            height: 30vh;

        }

        .box1 {
            background-color: red;
            position: sticky;
            top: 10px;
            left: 20px;
        }

        .box2 {
            background-color: blue;
            position: relative;
            top: 20px;
            left: 30px;
        }

        .box3 {
            background-color: green;
            position: relative;
            z-index: 1;
        }

        .box4 {
            background-color: orange;
            position: fixed;
            width: 80vw;
            height: 100px;
            top: 200px;
            left: 100px;
        }

        .parent {
            margin: 20px;
            padding: 30px;
            border: 3px solid blue;
            /* position: absolute; */
            /*Exception: transform, filter, or perspective properties can also make an element appear as positioned  */
            transform: translate(0);
            perspective: 0em;
            filter: invert(0);
        }
    </style>
</head>

<body>
    <div class="parent">

        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>

</html>


<!-- position: absolute 
 
works:  if we put any element as absolute positon then it checks for its parent and relatively moves according to it like if we set top or left to that absolute positioned element it moves according to its parent

-->
