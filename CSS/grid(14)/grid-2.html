<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid-2</title>
    <style>
        .container {
            border: 2px solid red;
            display: grid;
            grid-template-areas: "nav nav nav"
                                "side article article"
                                "main span span";
        }

        .item {
            border: 2px solid black;
            /* width: 30px; */
            height: 60px;
        }

        .item-1 {
            grid-area: nav;
            
        }
        .item-2 {
            grid-area: side;
            
        }
        .item-3 {
            grid-area: article;
            
        }
        .item-4 {
            grid-area: main;
            
        }
        .item-5{
            grid-area: span;
        }
    </style>

</head>

<body>
    <div class="container">
        <div class="item item-1">1</div>
        <div class="item item-2">2</div>
        <div class="item item-3">3</div>
        <div class="item item-4">4</div>
        <div class="item item-5">5</div>
    </div>
</body>

</html>



<!-- grid line ; grid cell ; grid track ; grid area -->
<!-- grid-row = 1/3  meaning : the particular item occupies from 1 to 3 rows-->
<!-- grid-colomn=1/2 meaning: the particular item occupies from 1 to 2 colomns -->
<!-- we can either name the rows and colomns like:
 grid-rows=[first] 100px [second] 200px [third] 300px; -->
 <!-- while we are combining we can use these grid names -->
