<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        * {
            margin: 0%;
            padding: 0%;
        }

        .box {
            background-color: antiquewhite;
        }

        .box1 {
            color: rgb(88, 145, 145);
            padding: 10px;
            border: 4px solid black;
            margin: 10px;
            box-sizing: border-box;
        }

        .box2 {
            color: red;
            padding: 10px;
            border: 4px solid black;
            margin: 20px;
            height: 100px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <div class="box box1">
        I am a box1
    </div>
    <div class="box box2">I am Box2</div>
</body>

</html>


<!-- when we write box-sizing:border-box it means that the particular height =  content + border + padding but not the margin -->
