<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image with HTML</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <img height="234" src="image.png" alt="nature image">
    <video src="viksha.mp4" height="350" controls loop muted></video>
    <table>
        <caption>Student Details</caption>
        <tr>
            <th>Name</th>
            <th>Designation</th>
            <th>Fav Language</th>
        </tr>
        <tr>
            <td colspan="2">Bhandavi</td>
            <td rowspan="2">Java</td>

        </tr>
        <tr>
            <td colspan="2">Bhandavi</td>
        </tr>
        <tr>
            <td colspan="2">Grishma</td>
            <td></td>
            <td></td>
        </tr>
    </table>
    <ul type="square">
        <li>Bhandavi</li>
        <li>Grishma</li>
        <li>Keerthana</li>

    </ul>
    <ol type="I">
        <li>hi</li>
        <li>hello</li>
        <li>bye!!</li>
    </ol>
</body>

</html>


<!--td - table data -->
<!-- th - table heading -->
<!--tr - table row-->
<!--ul - unordered list-->
<!-- ol -ordered list-->
