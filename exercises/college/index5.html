<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 4 Card Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-4">
        <div class="card" style="width: 18rem;">
            <img src="https://media.istockphoto.com/id/1360554439/photo/maldives-tropical-island.webp?a=1&b=1&s=612x612&w=0&k=20&c=KF5Bj2zltHbcVbVM0q7Qr3SZSccZoHUGqqTTAhv1GQU=" class="card-img-top" alt="Card Image">
            <div class="card-body">
                <h5 class="card-title">Beach</h5>
                <p class="card-text">Beaches are peaceful and beautiful</p>
                <a href="#" class="btn btn-primary">Read More</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
