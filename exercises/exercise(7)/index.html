<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise-7</title>
    <style>
        .container {
            position: relative;
            width: 60vw;
            height: 90vh;
            background-color: blue;
            display: flex;
            align-items: last baseline;

        }

        .box {
            position: absolute;
            width: 100px;
            height: 100px;
            background-color: red;
            border-radius: 55px;
            animation:  a 3s linear infinite, b 1s ease-out infinite alternate;
        }
        @keyframes a{
            from{
                left: 0;
            }
            to{
                left: 100%;
            }
        }

        @keyframes b{
            from{
                bottom: 0;
            }
            to{
                bottom: 100%;
            }
        }

        
    </style>
</head>

<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>

</html>
