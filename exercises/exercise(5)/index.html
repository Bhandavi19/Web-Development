<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise-5</title>
    <style>
        
        * {
            margin: 0;
            padding: 0;
        }
        header{
            position: sticky;
            top: 0;
        }

        nav {
            background-color: rgb(245, 152, 245);
            width: 100%;
            height: 50px;
        }
        main{
            background-color: black;
            color: white;
            margin-bottom: 10px;
            padding: 20px;
        }

        .container {

            background-color: green;
            margin: 10px 15px;
            height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 80px;
        }

        .box1 {
            width: 30vw;
            height: 50vh;
            background-color: pink;
        }

        .box2 {
            width: 30vw;
            height: 50vh;
            background-color: blue;
        }

        .content {
            /* width: 40vw; */
            height: 15vh;
            color: aliceblue;
            margin: 0 28vw;
            padding: 25px;
            border-radius: 10px;
            border: 2px solid white;
            text-align: center;
            font-size: 2em;

        }

        footer {
            background-color: grey;
            height: 100px;
        }

        .circle{
            height: 30px;
            width: 30px;
            border-radius: 15px;
            background-color: orange;
            right: 50px;
            bottom: 50px;
            position: fixed;
        }
    </style>
</head>

<body>
    <header>

        <div>
            <nav></nav>
        </div>
    </header>
    <main>

        <div class="container">
            <div class="box1"></div>
            <div class="box2"></div>
        </div>
        <div class="content">
            <p>Welcome to IARE College. I am Student of IARE College</p>
        </div>
        <div class="circle"></div>
    </main>
    <footer></footer>

</body>

</html>
